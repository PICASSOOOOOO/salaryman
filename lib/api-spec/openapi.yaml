openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: openai
    description: OpenAI AI chat, image, and audio operations
  - name: interview
    description: Interview helper operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOpenaiConversationBody"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendOpenaiMessageBody"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
  /interview/solve:
    post:
      operationId: solveInterviewQuestion
      tags: [interview]
      summary: Solve a coding interview question with streaming response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SolveInterviewQuestionBody"
      responses:
        "200":
          description: SSE stream of solution chunks
          content:
            text/event-stream: {}
  /auth/discord:
    get:
      tags: [Auth]
      operationId: beginDiscordLogin
      summary: Start the browser Discord OAuth login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the Discord authorization endpoint.
  /auth/discord/callback:
    get:
      tags: [Auth]
      operationId: handleDiscordLoginCallback
      summary: Complete the browser Discord OAuth login flow
      responses:
        "302":
          description: Redirect to the returnTo path on success.
  /crm/custom-fields:
    get:
      operationId: listCrmCustomFields
      tags: [crm]
      responses:
        "200":
          description: Organization CRM field definitions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CrmCustomField" }
    post:
      operationId: createCrmCustomField
      tags: [crm]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmCustomFieldInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmCustomField" }
  /crm/custom-fields/{fieldKey}:
    patch:
      operationId: updateCrmCustomField
      tags: [crm]
      parameters:
        - name: fieldKey
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmCustomFieldUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmCustomField" }
  /crm/leads/import/preview:
    post:
      operationId: previewCrmLeadImport
      tags: [crm]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/CrmImportPreviewInput" }
      responses:
        "200":
          description: Import preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmImportPreview" }
  /crm/leads/import/apply:
    post:
      operationId: applyCrmLeadImport
      tags: [crm]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmImportApplyInput" }
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmImportResult" }
  /crm/archive/export:
    get:
      operationId: exportCrmArchive
      tags: [crm]
      responses:
        "200":
          description: Full organization CRM archive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmArchive" }
components:
  schemas:
    CrmCustomField:
      type: object
      required: [id, orgId, fieldKey, label, fieldType, optionsJson, required, archived, position]
      properties:
        id: { type: integer }
        orgId: { type: integer }
        fieldKey: { type: string }
        label: { type: string }
        fieldType: { type: string, enum: [text, number, boolean, date, select] }
        optionsJson: { type: array, items: { type: string } }
        required: { type: boolean }
        archived: { type: boolean }
        position: { type: integer }
    CrmCustomFieldInput:
      type: object
      required: [fieldKey, label, fieldType]
      properties:
        fieldKey: { type: string }
        label: { type: string }
        fieldType: { type: string, enum: [text, number, boolean, date, select] }
        optionsJson: { type: array, items: { type: string } }
        required: { type: boolean }
        position: { type: integer }
    CrmCustomFieldUpdate:
      type: object
      properties:
        label: { type: string }
        optionsJson: { type: array, items: { type: string } }
        required: { type: boolean }
        archived: { type: boolean }
        position: { type: integer }
    CrmImportPreview:
      type: object
      required: [headers, sampleRows, rowCount, candidates]
      properties:
        headers: { type: array, items: { type: string } }
        sampleRows: { type: array, items: { type: array, items: { type: string } } }
        rowCount: { type: integer }
        candidates: { type: array, items: { type: object, additionalProperties: true } }
        rows: { type: array, items: { type: array, items: { type: string } } }
    CrmImportPreviewInput:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }
    CrmImportApplyInput:
      type: object
      required: [headers, rows, mapping, existingRowPolicy, authority]
      properties:
        headers: { type: array, items: { type: string } }
        rows: { type: array, items: { type: array, items: {} } }
        mapping: { type: object, additionalProperties: { type: string } }
        existingRowPolicy: { type: string, enum: [skip, update] }
        authority: { type: string, enum: [import, crm] }
    CrmImportResult:
      type: object
      additionalProperties: true
    CrmArchive:
      type: object
      additionalProperties: true
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt
    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt
    CreateOpenaiConversationBody:
      type: object
      properties:
        title:
          type: string
      required:
        - title
    SendOpenaiMessageBody:
      type: object
      properties:
        content:
          type: string
      required:
        - content
    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - createdAt
        - messages
    OpenaiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    SolveInterviewQuestionBody:
      type: object
      properties:
        question:
          type: string
          description: The coding interview question text
        language:
          type: string
          description: Programming language (python, javascript, typescript, java, cpp, go, rust)
        mode:
          type: string
          description: "Response mode: hint, solution, explain, complexity"
          enum: [hint, solution, explain, complexity, say_it]
      required:
        - question
        - language
        - mode
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, "null"]
          format: email
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        profileImageUrl:
          type: [string, "null"]
        username:
          type: [string, "null"]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      schema:
        type: string
    SessionCookie:
      name: session
      in: cookie
      required: false
      schema:
        type: string
