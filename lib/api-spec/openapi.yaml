openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: phone
    description: Authenticated phone recording and archive operations
  - name: workspace
    description: User-owned creative workspace operations
  - name: openai
    description: OpenAI AI chat, image, and audio operations
  - name: interview
    description: Interview helper operations
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /workspace/projects/{projectId}/generate:
    post:
      operationId: generateWorkspaceProjectDraft
      tags: [workspace]
      summary: Generate a reviewable project plan and prototype
      parameters:
        - name: projectId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceProjectGenerationInput"
      responses:
        "201":
          description: Generated drafts saved to the project
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorkspaceProjectGenerationResponse"
        "400":
          description: Invalid project brief
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "401":
          description: Login required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "404":
          description: Project not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
        "502":
          description: Pablo could not produce a valid draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /openai/conversations:
    get:
      operationId: listOpenaiConversations
      tags: [openai]
      summary: List all conversations
      responses:
        "200":
          description: List of conversations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiConversation"
    post:
      operationId: createOpenaiConversation
      tags: [openai]
      summary: Create a new conversation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiConversationInput"
      responses:
        "201":
          description: Created conversation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversation"
  /openai/conversations/{id}:
    get:
      operationId: getOpenaiConversation
      tags: [openai]
      summary: Get conversation with messages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Conversation with messages
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiConversationWithMessages"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
    delete:
      operationId: deleteOpenaiConversation
      tags: [openai]
      summary: Delete a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OpenaiError"
  /openai/conversations/{id}/messages:
    get:
      operationId: listOpenaiMessages
      tags: [openai]
      summary: List messages in a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: List of messages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OpenaiMessage"
    post:
      operationId: sendOpenaiMessage
      tags: [openai]
      summary: Send a text message and receive a streaming text response
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenaiMessageInput"
      responses:
        "200":
          description: SSE stream of assistant text chunks
          content:
            text/event-stream: {}
  /interview/solve:
    post:
      operationId: solveInterviewQuestion
      tags: [interview]
      summary: Solve a coding interview question with streaming response
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterviewQuestionInput"
      responses:
        "200":
          description: SSE stream of solution chunks
          content:
            text/event-stream: {}
  /auth/discord:
    get:
      tags: [Auth]
      operationId: beginDiscordLogin
      summary: Start the browser Discord OAuth login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          schema:
            type: string
      responses:
        "302":
          description: Redirect to the Discord authorization endpoint.
  /auth/discord/callback:
    get:
      tags: [Auth]
      operationId: handleDiscordLoginCallback
      summary: Complete the browser Discord OAuth login flow
      responses:
        "302":
          description: Redirect to the returnTo path on success.
  /orgs/me:
    get:
      operationId: getMyOrganizations
      tags: [organizations]
      responses:
        "200":
          description: Active organization context and all active memberships
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MyOrganizations" }
  /orgs/switch:
    post:
      operationId: switchOrganization
      tags: [organizations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SwitchOrganizationInput" }
      responses:
        "200":
          description: Updated active organization context
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SwitchOrganizationResult" }
  /crm/custom-fields:
    get:
      operationId: listCrmCustomFields
      tags: [crm]
      responses:
        "200":
          description: Organization CRM field definitions
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/CrmCustomField" }
    post:
      operationId: createCrmCustomField
      tags: [crm]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmCustomFieldInput" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmCustomField" }
  /crm/custom-fields/{fieldKey}:
    patch:
      operationId: updateCrmCustomField
      tags: [crm]
      parameters:
        - name: fieldKey
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmCustomFieldUpdate" }
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmCustomField" }
  /crm/leads/import/preview:
    post:
      operationId: previewCrmLeadImport
      tags: [crm]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: "#/components/schemas/CrmImportPreviewInput" }
      responses:
        "200":
          description: Import preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmImportPreview" }
  /crm/leads/import/apply:
    post:
      operationId: applyCrmLeadImport
      tags: [crm]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmImportApplyInput" }
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmImportResult" }
  /crm/archive/export:
    get:
      operationId: exportCrmArchive
      tags: [crm]
      responses:
        "200":
          description: Full organization CRM archive
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CrmArchive" }
  /crm/sources:
    get:
      operationId: listCrmSources
      tags: [crm]
      responses:
        "200": { description: Sources, content: { application/json: { schema: { type: object } } } }
    post:
      operationId: createCrmSource
      tags: [crm]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmSourceInput" }
      responses:
        "201": { description: Created, content: { application/json: { schema: { type: object } } } }
  /crm/sources/{id}:
    delete:
      operationId: deleteCrmSource
      tags: [crm]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Deleted, content: { application/json: { schema: { type: object } } } }
  /crm/google/connect:
    get:
      operationId: connectCrmGoogleSheets
      tags: [crm]
      parameters:
        - { name: sourceId, in: query, required: true, schema: { type: integer } }
      responses:
        "200": { description: OAuth authorization URL, content: { application/json: { schema: { type: object } } } }
        "503": { description: Google OAuth configuration is missing }
  /crm/google/callback:
    get:
      operationId: completeCrmGoogleSheets
      tags: [crm]
      parameters:
        - { name: error, in: query, required: false, schema: { type: string } }
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: true, schema: { type: string } }
      responses:
        "303":
          description: Redirect to Leads after authorization completes
          headers:
            Location: { schema: { type: string } }
  /crm/sources/{id}/sync:
    post:
      operationId: syncCrmSource
      tags: [crm]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { description: Sync result, content: { application/json: { schema: { type: object } } } }
  /crm/sync/conflicts:
    get:
      operationId: listCrmSyncConflicts
      tags: [crm]
      responses:
        "200": { description: Conflicts, content: { application/json: { schema: { type: object } } } }
  /crm/sync/conflicts/{id}/resolve:
    post:
      operationId: resolveCrmSyncConflict
      tags: [crm]
      parameters:
        - { name: id, in: path, required: true, schema: { type: integer } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CrmSyncConflictResolutionInput" }
      responses:
        "200": { description: Resolved, content: { application/json: { schema: { type: object } } } }
  /twilio/recording/{callId}:
    get:
      operationId: getSecureCallRecording
      tags: [phone]
      summary: Stream an authorized call recording or a bounded excerpt
      parameters:
        - name: callId
          in: path
          required: true
          schema: { type: integer }
        - name: startMs
          in: query
          required: false
          description: Excerpt start offset in milliseconds; requires endMs.
          schema: { type: integer, minimum: 0 }
        - name: endMs
          in: query
          required: false
          description: Excerpt end offset in milliseconds; excerpt length is limited to ten minutes.
          schema: { type: integer, minimum: 1 }
        - name: download
          in: query
          required: false
          schema: { type: string, enum: ["1"] }
      responses:
        "200":
          description: Authenticated MP3 recording or excerpt
          content:
            audio/mpeg:
              schema: { type: string, format: binary }
        "400": { description: Invalid excerpt range }
        "401": { description: Login required }
        "403": { description: Recording access denied }
        "404": { description: Recording not found }
  /twilio/recording/{callId}/excerpts:
    put:
      operationId: saveCallRecordingExcerpts
      tags: [phone]
      summary: Save user-confirmed timestamp ranges for a call recording
      parameters:
        - name: callId
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RecordingExcerptSaveInput" }
      responses:
        "200":
          description: Saved excerpt metadata
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecordingExcerptSaveResponse" }
        "400": { description: Invalid excerpt boundaries or metadata }
        "401": { description: Login required }
        "403": { description: Recording access denied }
        "404": { description: Recording not found }
  /twilio/internal-directory:
    get:
      operationId: getPhoneInternalDirectory
      tags: [phone]
      summary: List eligible CALLL HOME employees and office lines in the active organization
      responses:
        "200":
          description: Internal employee directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhoneInternalDirectory"
  /twilio/internal-directory/lines/{id}:
    put:
      operationId: assignPhoneInternalLine
      tags: [phone]
      summary: Assign an organization-owned office line to an eligible employee
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PhoneInternalLineAssignment"
      responses:
        "200":
          description: Office line assignment updated
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean }
        "400":
          description: Invalid assignment
  /twilio/pablo/internal-delivery:
    post:
      operationId: sendPabloInternalDelivery
      tags: [phone]
      summary: Deliver a message or report to an eligible employee through Pablo PRIME
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PabloInternalDelivery"
      responses:
        "201":
          description: Internal delivery created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PabloInternalDeliveryResult"
        "403":
          description: CALLL HOME or Pablo PRIME paid access is required
components:
  schemas:
    RecordingExcerptSaveInput:
      type: object
      required: [excerpts]
      properties:
        excerpts:
          type: array
          maxItems: 40
          items: { $ref: "#/components/schemas/RecordingExcerpt" }
    RecordingExcerpt:
      type: object
      required: [id, label, startMs, endMs, transcriptText, createdAt, updatedAt]
      properties:
        id: { type: string, minLength: 1, maxLength: 64 }
        label: { type: string, minLength: 1, maxLength: 120 }
        startMs: { type: integer, minimum: 0 }
        endMs: { type: integer, minimum: 1 }
        transcriptText: { type: string, maxLength: 2000 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    RecordingExcerptSaveResponse:
      type: object
      required: [excerpts]
      properties:
        excerpts:
          type: array
          items: { $ref: "#/components/schemas/RecordingExcerpt" }
    PhoneInternalDirectory:
      type: object
      required: [organizationId, canManageLines, members, lines]
      properties:
        organizationId: { type: ["integer", "null"] }
        canManageLines: { type: boolean }
        members:
          type: array
          items: { $ref: "#/components/schemas/PhoneInternalDirectoryMember" }
        lines:
          type: array
          items: { $ref: "#/components/schemas/PhoneInternalDirectoryLine" }
    PhoneInternalDirectoryMember:
      type: object
      required: [userId, displayName, role, phoneNumber, isSelf]
      properties:
        userId: { type: string }
        displayName: { type: string }
        title: { type: ["string", "null"] }
        role: { type: string }
        phoneNumber: { type: ["string", "null"] }
        isSelf: { type: boolean }
    PhoneInternalDirectoryLine:
      type: object
      required: [id, number, label, assignedUserId, assignedName, isActive]
      properties:
        id: { type: integer }
        number: { type: string }
        label: { type: string }
        assignedUserId: { type: ["string", "null"] }
        assignedName: { type: ["string", "null"] }
        isActive: { type: boolean }
    PhoneInternalLineAssignment:
      type: object
      required: [assignedUserId]
      properties:
        assignedUserId: { type: string, minLength: 1 }
    PabloInternalDelivery:
      type: object
      required: [targetUserId, category, title, body]
      properties:
        targetUserId: { type: string, minLength: 1 }
        category: { type: string, enum: [message, report] }
        title: { type: string, minLength: 1, maxLength: 120 }
        body: { type: string, minLength: 1, maxLength: 1800 }
    PabloInternalDeliveryResult:
      type: object
      required: [ok, notificationId]
      properties:
        ok: { type: boolean }
        notificationId: { type: integer }
    MyOrganizations:
      type: object
      required: [org, member, members, featureGrants, allOrgs]
      properties:
        org: { type: [object, "null"], additionalProperties: true }
        member: { type: [object, "null"], additionalProperties: true }
        members: { type: array, items: { type: object, additionalProperties: true } }
        featureGrants: { type: array, items: { type: object, additionalProperties: true } }
        allOrgs: { type: array, items: { type: object, additionalProperties: true } }
    SwitchOrganizationInput:
      type: object
      required: [orgId]
      properties:
        orgId: { type: [integer, "null"] }
    SwitchOrganizationResult:
      type: object
      required: [ok, currentOrgId]
      properties:
        ok: { type: boolean }
        currentOrgId: { type: [string, "null"] }
    CrmCustomField:
      type: object
      required: [id, orgId, fieldKey, label, fieldType, optionsJson, required, archived, position]
      properties:
        id: { type: integer }
        orgId: { type: integer }
        fieldKey: { type: string }
        label: { type: string }
        fieldType: { type: string, enum: [text, number, boolean, date, select] }
        optionsJson: { type: array, items: { type: string } }
        required: { type: boolean }
        archived: { type: boolean }
        position: { type: integer }
    CrmCustomFieldInput:
      type: object
      required: [fieldKey, label, fieldType]
      properties:
        fieldKey: { type: string }
        label: { type: string }
        fieldType: { type: string, enum: [text, number, boolean, date, select] }
        optionsJson: { type: array, items: { type: string } }
        required: { type: boolean }
        position: { type: integer }
    CrmCustomFieldUpdate:
      type: object
      properties:
        label: { type: string }
        optionsJson: { type: array, items: { type: string } }
        required: { type: boolean }
        archived: { type: boolean }
        position: { type: integer }
    CrmImportPreview:
      type: object
      required: [headers, sampleRows, rowCount, candidates]
      properties:
        headers: { type: array, items: { type: string } }
        sampleRows: { type: array, items: { type: array, items: { type: string } } }
        rowCount: { type: integer }
        candidates: { type: array, items: { type: object, additionalProperties: true } }
        rows: { type: array, items: { type: array, items: { type: string } } }
    CrmImportPreviewInput:
      type: object
      required: [file]
      properties:
        file: { type: string, format: binary }
    CrmImportApplyInput:
      type: object
      required: [headers, rows, mapping, existingRowPolicy, authority]
      properties:
        headers: { type: array, items: { type: string } }
        rows: { type: array, items: { type: array, items: {} } }
        mapping: { type: object, additionalProperties: { type: string } }
        existingRowPolicy: { type: string, enum: [skip, update] }
        authority: { type: string, enum: [import, crm] }
    CrmImportResult:
      type: object
      additionalProperties: true
    CrmArchive:
      type: object
      additionalProperties: true
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    OpenaiConversation:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - title
        - createdAt
    OpenaiMessage:
      type: object
      properties:
        id:
          type: integer
        conversationId:
          type: integer
        role:
          type: string
        content:
          type: string
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - conversationId
        - role
        - content
        - createdAt
    OpenaiConversationInput:
      type: object
      properties:
        title:
          type: string
      required:
        - title
    OpenaiMessageInput:
      type: object
      properties:
        content:
          type: string
      required:
        - content
    OpenaiConversationWithMessages:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        createdAt:
          type: string
          format: date-time
        messages:
          type: array
          items:
            $ref: "#/components/schemas/OpenaiMessage"
      required:
        - id
        - title
        - createdAt
        - messages
    OpenaiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    InterviewQuestionInput:
      type: object
      properties:
        question:
          type: string
          description: The coding interview question text
        language:
          type: string
          description: Programming language (python, javascript, typescript, java, cpp, go, rust)
        mode:
          type: string
          description: "Response mode: hint, solution, explain, complexity"
          enum: [hint, solution, explain, complexity, say_it]
      required:
        - question
        - language
        - mode
    CrmSourceInput:
      type: object
      additionalProperties: true
    CrmSyncConflictResolutionInput:
      type: object
      properties:
        resolution:
          type: string
          enum: [crm, source]
      required:
        - resolution
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, "null"]
          format: email
        firstName:
          type: [string, "null"]
        lastName:
          type: [string, "null"]
        profileImageUrl:
          type: [string, "null"]
        username:
          type: [string, "null"]
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/AuthUser"
            - type: "null"
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    WorkspaceProjectGenerationInput:
      type: object
      required: [brief]
      properties:
        brief:
          type: string
          minLength: 1
          maxLength: 4000
    WorkspaceGeneratedNote:
      type: object
      required: [id, projectId, title, content, category]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        title:
          type: string
        content:
          type: string
        category:
          type: string
    WorkspaceProjectGenerationResponse:
      type: object
      required: [plan, prototype]
      properties:
        plan:
          $ref: "#/components/schemas/WorkspaceGeneratedNote"
        prototype:
          $ref: "#/components/schemas/WorkspaceGeneratedNote"
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      schema:
        type: string
    SessionCookie:
      name: session
      in: cookie
      required: false
      schema:
        type: string
