name: Build native desktop clients

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: salaryman-office-windows
            smoke: dist/salaryman-office/SALARYMAN Office/SALARYMAN Office.exe
          - os: macos-14
            artifact: salaryman-office-macos
            smoke: dist/salaryman-office/SALARYMAN Office.app/Contents/MacOS/SALARYMAN Office
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install native build dependencies
        run: python -m pip install -e ".[desktop-build]"

      - name: Build native client
        run: python scripts/build_desktop.py

      - name: Smoke-test packaged client
        shell: bash
        run: '"${{ matrix.smoke }}" --headless --frames 3 --no-bridge'

      - name: Upload native archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/releases/*
          if-no-files-found: error
